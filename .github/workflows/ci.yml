name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"   # la misma que trae la imagen de Hermes en producción
          cache: pip
      - run: pip install -r requirements.txt ruff
      - name: Lint
        run: ruff check .
      - name: Test
        run: python -m pytest -q
